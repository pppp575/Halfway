# Checks every pull request and every push: lint, formatting, tests and a production build.
name: CI

on:
  pull_request:
  push:
    branches-ignore: ['main']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint, formatting and tests
        run: npm run check
      - name: Build
        run: npm run build
